<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конвертер валют</title><style>body{font:16px Arial;background:#f2f5fa;color:#17233a;margin:0;padding:32px}main{max-width:740px;margin:auto;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 25px #0001}input,select,button{padding:12px;margin:6px;border:1px solid #ccd4df;border-radius:8px;font-size:16px}button{background:#245de0;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}#result{font-size:20px;font-weight:bold}</style></head><body><main><h1>Конвертер валют</h1><p>Курсы валют и журнал операций</p><input id="amount" type="number" min="0.01" value="100" step="0.01"><select id="source"></select> → <select id="target"></select><p><button onclick="convert()">Конвертировать</button> <button onclick="history()">История операций</button></p><p id="result"></p><h2>История конвертаций</h2><div style="overflow:auto"><table><thead><tr><th>Дата</th><th>Сумма</th><th>Из</th><th>В</th><th>Результат</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const currencies=['USD','EUR','RUB','GBP','CNY'];for(const id of ['source','target']){document.getElementById(id).innerHTML=currencies.map(c=>`<option>${c}</option>`).join('')}target.value='EUR';async function convert(){let out=document.getElementById('result');out.textContent='Загрузка...';try{let r=await fetch('/api/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:amount.value,source:source.value,target:target.value})});let d=await r.json();if(!r.ok)throw Error(d.error);out.textContent=`${d.amount} ${d.source} = ${d.result} ${d.target} (курс ${d.rate})`;history()}catch(e){out.textContent=e.message}}async function history(){try{let r=await fetch('/api/history');if(!r.ok)throw Error('Ошибка загрузки');let data=await r.json();document.getElementById('rows').innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('ru-RU')}</td><td>${x.amount}</td><td>${x.source}</td><td>${x.target}</td><td>${x.result}</td></tr>`).join('')}catch(e){document.getElementById('result').textContent=e.message}}history();</script></body></html>
