services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: currency
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d currency"]
      interval: 5s
      retries: 10
  web-service:
    build: ./web-service
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:local_password@db:5432/currency
      WEB_SERVICE_URL: http://web-service:5001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata:
